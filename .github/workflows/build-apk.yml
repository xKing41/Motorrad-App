name: APK bauen

# Baut die fertige APK in der Cloud auf einem echten Linux-Rechner.
# Damit braucht das Handy nur einen Browser: Workflow starten, warten,
# APK herunterladen, installieren.
#
# Der Ablauf macht genau das, was die setup.bat auf dem PC macht -
# Projekt anlegen, eigene Dateien darueberkopieren, Gradle-Fixes setzen.

on:
  # Von Hand startbar (auch vom Handy aus, im Reiter "Actions").
  workflow_dispatch:
  # Und automatisch bei jeder Aenderung am Code - auch auf Arbeitszweigen,
  # damit man eine Aenderung testen kann, bevor sie nach main kommt.
  push:
    branches: [main, master, 'claude/**']

# Kommt ein neuer Push, waehrend noch gebaut wird: alten Lauf abbrechen.
# Spart Bauminuten.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Umgebung anzeigen
        run: flutter --version

      - name: Projekt aufbauen
        run: |
          set -e
          # Gerüst erzeugen (liefert android/, Gradle-Dateien, Icons)
          flutter create --platforms=android --project-name schraeglage proj

          # Eigene Dateien darueberlegen
          cp app/pubspec.yaml proj/pubspec.yaml
          rm -rf proj/lib
          cp -r app/lib proj/lib
          cp -r app/android/. proj/android/
          # Kartenstile und andere Dateien, die in die App gehoeren
          rm -rf proj/assets
          if [ -d app/assets ]; then cp -r app/assets proj/assets; fi
          # Eigene Tests statt der Beispiel-Tests aus der Vorlage
          rm -rf proj/test
          if [ -d app/test ]; then cp -r app/test proj/test; fi

          # minSdk 24 - wird von geolocator verlangt
          for f in proj/android/app/build.gradle.kts proj/android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i 's/flutter\.minSdkVersion/24/g' "$f"
            fi
          done

          # compileSdk-Fix fuer die Plugin-Module anhaengen
          if [ -f proj/android/compilesdk-fix.txt ]; then
            cat proj/android/compilesdk-fix.txt >> proj/android/build.gradle.kts
          fi

          # Fester Signaturschluessel fuer alle Cloud-Builds.
          # Ohne ihn erzeugt JEDER Lauf einen neuen Schluessel - die neue
          # APK liesse sich dann nicht ueber die alte installieren, man
          # muesste deinstallieren und verloere alle Fahrten.
          KS="$GITHUB_WORKSPACE/proj/android/ci-signing.jks"
          if [ -f "$KS" ]; then
            {
              echo ""
              echo "android.injected.signing.store.file=$KS"
              echo "android.injected.signing.store.type=pkcs12"
              echo "android.injected.signing.store.password=schraeglage"
              echo "android.injected.signing.key.alias=schraeglage"
              echo "android.injected.signing.key.password=schraeglage"
            } >> proj/android/gradle.properties
          fi

          echo "--- android/app/build.gradle.kts (Auszug) ---"
          grep -n "compileSdk\|minSdk" proj/android/app/build.gradle.kts || true

      - name: Abhaengigkeiten laden
        working-directory: proj
        run: flutter pub get

      # Findet Fehler, bevor der lange APK-Bau startet. Nur echte Fehler
      # brechen ab, Stil-Hinweise nicht.
      - name: Code pruefen
        working-directory: proj
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        working-directory: proj
        run: flutter test

      # Normale App: das, was Kunden und Kollegen bekommen.
      - name: APK bauen
        working-directory: proj
        run: |
          flutter build apk --release
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/Schraeglage.apk

      # Paket fuer den Google Play Store (AAB). Nur, wenn der
      # Upload-Schluessel als Secret hinterlegt ist (siehe PLAYSTORE.md).
      # Eigene App-Kennung (com.example... nimmt Google nicht an) und ohne
      # die Berechtigung "SMS senden" (braucht Sondergenehmigung).
      - name: Store-Paket (AAB) bauen
        working-directory: proj
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
        run: |
          set -e
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Kein Upload-Schluessel hinterlegt - Store-Paket uebersprungen."
            exit 0
          fi
          APP_ID="${STORE_APP_ID:-de.schraeglage.app}"
          cp android/gradle.properties "$RUNNER_TEMP/gradle.properties.bak"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/Manifest.bak"
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/$(basename $f).bak"
          done
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          sed -i '/android.injected.signing/d' android/gradle.properties
          {
            echo ""
            echo "android.injected.signing.store.file=$RUNNER_TEMP/upload.jks"
            echo "android.injected.signing.store.password=$UPLOAD_STORE_PASSWORD"
            echo "android.injected.signing.key.alias=$UPLOAD_KEY_ALIAS"
            echo "android.injected.signing.key.password=$UPLOAD_KEY_PASSWORD"
          } >> android/gradle.properties
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E "s/(applicationId[ =]+\")[^\"]+\"/\1$APP_ID\"/" "$f"
              grep -n "applicationId" "$f"
            fi
          done
          sed -i -E '/android.permission.(SEND_SMS|RECORD_AUDIO|BLUETOOTH_CONNECT)"/d' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml
          flutter build appbundle --release --dart-define=SCHRAEGLAGE_STORE=true
          cp build/app/outputs/bundle/release/app-release.aab ../out/Schraeglage-Store.aab
          # Zurueck fuer die Test-App
          cp "$RUNNER_TEMP/gradle.properties.bak" android/gradle.properties
          cp "$RUNNER_TEMP/Manifest.bak" android/app/src/main/AndroidManifest.xml
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$RUNNER_TEMP/$(basename $f).bak" ] && cp "$RUNNER_TEMP/$(basename $f).bak" "$f"
          done
          rm -f "$RUNNER_TEMP/upload.jks"

      # Test-App: dieselbe App plus Test-Werkzeuge (Probefahrt ...), mit
      # eigener App-Kennung und eigenem Namen - liegt NEBEN der normalen
      # App auf dem Handy und hat eigene Daten.
      - name: Test-APK bauen
        working-directory: proj
        run: |
          set -e
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/(applicationId[ =]+")([^"]+)"/\1\2.testing"/' "$f"
              grep -n "applicationId" "$f"
            fi
          done
          sed -i 's/android:label="Schräglage"/android:label="Schräglage Testing"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          # Eigenes Symbol (blauer Streifen) - auf dem Handy unterscheidbar.
          if [ -d android/testing-res ]; then
            cp -r android/testing-res/. android/app/src/main/res/
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi
          flutter build apk --release --dart-define=SCHRAEGLAGE_TEST=true
          cp build/app/outputs/flutter-apk/app-release.apk ../out/Schraeglage-Testing.apk

      - name: Signatur anzeigen
        run: |
          APK=out/Schraeglage.apk
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$SIGNER" verify --print-certs "$APK" | grep -i "SHA-256" || true
          echo "Erwartet (fester Schluessel): e513fa43b826d686123371aa1ddec96cc73d11d611054c45e0da10857a59b572"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Schraeglage-APK
          path: out/Schraeglage.apk
          if-no-files-found: error
          retention-days: 30

      - name: Store-Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Schraeglage-Store-AAB
          path: out/Schraeglage-Store.aab
          if-no-files-found: ignore
          retention-days: 30

      - name: Test-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Schraeglage-Testing-APK
          path: out/Schraeglage-Testing.apk
          if-no-files-found: error
          retention-days: 30
