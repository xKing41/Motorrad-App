name: schraeglage
description: Schraeglage - Telemetrie, Karte und Navigation fuers Motorrad
publish_to: 'none'
version: 4.8.0+18

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Sensorik / Position
  sensors_plus: ^6.0.1
  geolocator: ^13.0.1
  wakelock_plus: ^1.2.8

  # Karte
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Daten / Netz / Dateien
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  http: ^1.2.2
  # Teilen-Dialog fuer den GPX-Export (WhatsApp, Drive, Navi-App ...).
  # Breiter Bereich, damit es auch mit einer aelteren Flutter-Version auf
  # dem PC noch baut.
  share_plus: '>=11.0.0 <14.0.0'
  # Sprachansagen bei der Navigation (Sprachausgabe des Handys).
  flutter_tts: ^4.2.0
  # GPX-Datei direkt aus dem Dateimanager / Downloads laden.
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
